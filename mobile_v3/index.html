<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#020914;color:#e9fbff;font-family:Arial,sans-serif}.app{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 36%,#0b456a88,transparent 36%),linear-gradient(#061726,#020914)}header{text-align:center;padding:18px 12px 8px;position:relative}.brand{letter-spacing:7px;color:#6deeff;font-size:21px;font-weight:900}.state{font-size:10px;color:#82a8b9;letter-spacing:2px;margin-top:7px}.vision{position:absolute;right:12px;top:12px;display:flex;gap:6px}.vision button{height:38px;min-width:42px;padding:0 10px;border-radius:20px;border:1px solid #35d8ef;background:#06283a;color:#bdf9ff;font-size:16px}.stage{position:relative;flex:1;min-height:0}.stage canvas{width:100%!important;height:100%!important;display:block}.bubble{position:absolute;right:16px;top:16px;max-width:65%;padding:10px 12px;border:1px solid #2c88ae;border-radius:15px 15px 4px;background:#061829dd;font-size:12px;line-height:1.35}.missing{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#83a8b9;padding:30px}.missing b{color:#ffc94e}.visionResult{position:absolute;left:14px;bottom:12px;right:14px;display:none;padding:12px 14px;border-radius:14px;border:1px solid #2a92b6;background:#03131fe8;font-size:13px;line-height:1.4;backdrop-filter:blur(8px)}.visionResult.show{display:block}.visionResult .tag{font-weight:900;letter-spacing:2px}.known{color:#50f0ac}.possible{color:#ffd166}.unknown{color:#a9c6d2}.bottom{padding:10px 14px 18px}.reply{min-height:48px;max-height:17vh;overflow:auto;text-align:center;font-size:14px;line-height:1.4;padding:7px 10px;color:#dffaff}.composer{display:flex;gap:8px;background:#041623;border:1px solid #1d7998;border-radius:18px;padding:7px}.composer input{flex:1;min-width:0;background:transparent;color:#fff;border:0;outline:0;padding:10px}.composer button{width:45px;border-radius:50%;border:1px solid #40dff4;background:#073148;color:#bdf9ff}.good{color:#50f0ac}.bad{color:#ff7189}</style>
<script type="importmap">{"imports":{"three":"./three/three.module.js"}}</script></head><body><div class="app"><header><div class="brand">KRISHNA</div><div id="state" class="state">CONNECTING</div><div class="vision"><button onclick="scanVision()" title="Scan enrolled identity">◉</button><button onclick="enrollVision()" title="Enroll person">＋👤</button></div></header><section id="stage" class="stage"><div id="missing" class="missing"><div><b>3D avatar waiting for PC sync</b><br><br>KRISHNA will load the rigged model from your trusted PC.</div></div><div id="bubble" class="bubble">Radhe Radhe. I am ready.</div><div id="visionResult" class="visionResult"></div></section><footer class="bottom"><div id="reply" class="reply">Talk to KRISHNA.</div><div class="composer"><input id="msg" placeholder="Talk to KRISHNA…" onkeydown="if(event.key==='Enter')send()"><button onclick="listen()">🎙</button><button onclick="send()">➤</button></div></footer></div>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from './three/GLTFLoader.js';
let scene,camera,renderer,avatar,mixer,clips={},action=null,mode='FLUTE',clock=new THREE.Clock();const stage=document.getElementById('stage'),missing=document.getElementById('missing');
function init(){scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(32,1,.01,100);camera.position.set(0,1.2,4.8);renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;stage.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xccefff,0x061018,2));const l=new THREE.DirectionalLight(0xffe6aa,3);l.position.set(3,4,4);scene.add(l);const r=new THREE.DirectionalLight(0x45cfff,2);r.position.set(-3,2,2);scene.add(r);new ResizeObserver(()=>{const b=stage.getBoundingClientRect();renderer.setSize(b.width,b.height,false);camera.aspect=b.width/b.height;camera.updateProjectionMatrix()}).observe(stage);loadAvatar();tick()}
function loadAvatar(){try{const b64=Krishna.avatarBase64();if(!b64)return;const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);new GLTFLoader().parse(u.buffer,'',g=>{missing.style.display='none';avatar=g.scene;scene.add(avatar);const box=new THREE.Box3().setFromObject(avatar),sz=box.getSize(new THREE.Vector3()),c=box.getCenter(new THREE.Vector3());avatar.position.sub(c);avatar.scale.setScalar(2.8/Math.max(sz.y,.1));avatar.position.y=-1.2;mixer=new THREE.AnimationMixer(avatar);g.animations.forEach(x=>clips[x.name.toUpperCase()]=x);setMode(mode)},()=>{});}catch(e){}}
function setMode(m,text){mode=m||'FLUTE';document.getElementById('state').textContent=mode;if(text)document.getElementById('bubble').textContent=text;if(mixer){if(action)action.fadeOut(.15);const c=clips[mode];action=c?mixer.clipAction(c):null;if(action)action.reset().fadeIn(.15).play()}}
function tick(){requestAnimationFrame(tick);const dt=clock.getDelta(),t=performance.now()/1000;if(mixer)mixer.update(dt);if(avatar&&!action){if(mode==='FLUTE')avatar.rotation.y=Math.sin(t*.35)*.08;if(mode==='SEARCH')avatar.rotation.y=Math.sin(t*.8)*.18;if(mode==='CHAT')avatar.rotation.z=Math.sin(t*3)*.015;if(mode==='WORKING')avatar.rotation.y=Math.sin(t*1.4)*.10}renderer.render(scene,camera)}
window.send=()=>{const i=document.getElementById('msg'),q=i.value.trim();if(!q)return;i.value='';setMode('CHAT','Listening…');setTimeout(()=>{try{const d=JSON.parse(Krishna.chat(q));if(d.error)throw new Error(d.error);const text=d.reply||d.text||'Done';document.getElementById('reply').textContent=text;setMode(d.avatar_state||'CHAT',text);speak(text)}catch(e){document.getElementById('reply').innerHTML='<span class=bad>'+e.message+'</span>'}},20)}
window.listen=()=>{if(!Krishna.voiceEnrolled()){document.getElementById('reply').textContent='Speak naturally for a few seconds to register the local owner voice profile.';setTimeout(()=>{const d=JSON.parse(Krishna.enrollVoice());document.getElementById('reply').textContent=d.error||'Voice profile registered locally. Tap the microphone again.'},100);return}if(!('webkitSpeechRecognition'in window)){document.getElementById('reply').textContent='Speech recognition unavailable; type your request.';return}const r=new webkitSpeechRecognition();r.lang='or-IN';r.interimResults=true;r.onstart=()=>setMode('CHAT','LISTENING');r.onresult=e=>{let t='';for(let k=e.resultIndex;k<e.results.length;k++)t+=e.results[k][0].transcript;document.getElementById('reply').textContent=t;if(e.results[e.results.length-1].isFinal){document.getElementById('msg').value=t.replace(/^krishna[ ,]*/i,'');send()}};r.onerror=e=>document.getElementById('reply').textContent='Voice: '+e.error;r.start()}
window.scanVision=()=>{try{const s=JSON.parse(Krishna.visionStatus());if(!s.configured){showVision({error:'KRISHNA Vision backend is not configured on the PC.'});return}setMode('SEARCH','Scanning enrolled identity…');Krishna.scanFace()}catch(e){showVision({error:e.message})}}
window.enrollVision=()=>{const name=prompt('Name of the person to enroll locally:');if(!name||!name.trim())return;if(!confirm('Enroll '+name.trim()+' in your local KRISHNA face gallery? The face will not be searched on social media.'))return;setMode('SEARCH','Capturing enrollment photo…');Krishna.enrollFace(name.trim())}
window.krishnaVisionResult=(raw)=>{let d;try{d=JSON.parse(raw)}catch(e){d={error:raw}}showVision(d);if(d.error){setMode('FLUTE','Vision needs attention');return}if(d.state==='ENROLLED'){setMode('FLUTE',d.subject+' enrolled locally');return}const who=d.subject?d.subject:'Unknown';setMode('FLUTE',d.state+': '+who)}
function showVision(d){const box=document.getElementById('visionResult');box.className='visionResult show';if(d.error){box.innerHTML='<span class="tag bad">VISION ERROR</span><br>'+escapeHtml(d.error);return}if(d.state==='ENROLLED'){box.innerHTML='<span class="tag known">ENROLLED</span><br>'+escapeHtml(d.subject)+' · local gallery only';return}const cls=d.state==='KNOWN'?'known':(d.state==='POSSIBLE_MATCH'?'possible':'unknown');const score=Math.round((Number(d.similarity)||0)*100);box.innerHTML='<span class="tag '+cls+'">'+escapeHtml(d.state||'UNKNOWN')+'</span><br>'+(d.subject?escapeHtml(d.subject)+' · ':'')+'similarity '+score+'% · enrolled gallery only';setTimeout(()=>box.classList.remove('show'),9000)}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=/[\u0B00-\u0B7F]/.test(t)?'or-IN':'en-IN';speechSynthesis.speak(u)}catch(e){}}
function poll(){try{const d=JSON.parse(Krishna.state());if(d.error)throw new Error(d.error);setMode(d.operator?.avatar_state||'FLUTE',d.operator?.current?.task||'Radhe Radhe. I am ready.');document.getElementById('state').className='state good'}catch(e){document.getElementById('state').textContent='PC OFFLINE';document.getElementById('state').className='state bad'}}
init();poll();setInterval(poll,5000);window.onerror=(m,s,l)=>{try{Krishna.log('JS '+m+' '+s+':'+l)}catch(e){}};
</script></body></html>
