name: Build KRISHNA APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build
        run: |
          mkdir -p app/src/main/java/com/krishna/mobile app/src/main/res/{values,drawable,xml,raw} app/src/main/assets
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google();mavenCentral();gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google();mavenCentral() } }
          rootProject.name='Krishna';include ':app'
          EOF
          echo "plugins { id 'com.android.application' version '8.7.3' apply false }" > build.gradle
          echo 'org.gradle.jvmargs=-Xmx2048m' > gradle.properties
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.krishna.mobile'; compileSdk 35
          defaultConfig { applicationId 'com.krishna.mobile'; minSdk 26; targetSdk 35; versionCode 12; versionName '1.5.3' } }
          EOF
          echo '<resources><string name="app_name">KRISHNA</string><style name="AppTheme" parent="android:style/Theme.Material.NoActionBar"/></resources>' > app/src/main/res/values/styles.xml
          echo '<shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#06182A"/><corners android:radius="24dp"/><stroke android:width="2dp" android:color="#00C8FF"/></shape>' > app/src/main/res/drawable/field.xml
          echo '<network-security-config><base-config><trust-anchors><certificates src="system"/><certificates src="user"/><certificates src="@raw/krishna_ca"/></trust-anchors></base-config></network-security-config>' > app/src/main/res/xml/network_security_config.xml
          cp app/src/main/res/raw/krishna-ca.cer app/src/main/res/raw/krishna_ca.cer
          rm app/src/main/res/raw/krishna-ca.cer
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/><application android:theme="@style/AppTheme" android:label="KRISHNA" android:icon="@drawable/krishna_hud" android:usesCleartextTraffic="true" android:networkSecurityConfig="@xml/network_security_config"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > app/src/main/java/com/krishna/mobile/MainActivity.java <<'EOF'
          package com.krishna.mobile;import android.app.*;import android.os.*;import android.content.*;import android.content.pm.PackageManager;import android.webkit.*;import java.net.*;import java.io.*;import javax.net.ssl.*;import org.json.*;public class MainActivity extends Activity{void startVoice(){startForegroundService(new Intent(this,VoiceService.class));}public void onCreate(Bundle b){super.onCreate(b);WebView w=new WebView(this);w.getSettings().setJavaScriptEnabled(true);w.getSettings().setDomStorageEnabled(true);w.addJavascriptInterface(new Bridge(),"Krishna");setContentView(w);w.loadUrl("file:///android_asset/index.html");}public class Bridge{String token(){return getSharedPreferences("k",0).getString("token","");}@JavascriptInterface public void pair(String t){getSharedPreferences("k",0).edit().putString("token",t.trim()).apply();}@JavascriptInterface public String status(){return call("/api/status",null);}@JavascriptInterface public void log(String e){call("/api/mobile-log","{\"event\":"+JSONObject.quote(e)+"}");}@JavascriptInterface public String chat(String m,boolean cloud){return call("/api/chat","{\"message\":"+JSONObject.quote(m)+",\"provider\":"+JSONObject.quote(cloud?"freellmapi":"local")+"}");}String call(String path,String body){try{HttpsURLConnection c=(HttpsURLConnection)new URL("https://192.168.0.106:8765"+path).openConnection();c.setConnectTimeout(3500);c.setReadTimeout(90000);c.setRequestProperty("Authorization","Bearer "+token());c.setRequestProperty("Origin","https://192.168.0.106:8765");c.setRequestProperty("Accept","application/json");if(body!=null){c.setRequestMethod("POST");c.setDoOutput(true);c.setRequestProperty("Content-Type","application/json");c.getOutputStream().write(body.getBytes("UTF-8"));}InputStream in=c.getResponseCode()<400?c.getInputStream():c.getErrorStream();ByteArrayOutputStream o=new ByteArrayOutputStream();byte[]b=new byte[1024];for(int n;(n=in.read(b))>0;)o.write(b,0,n);return o.toString("UTF-8");}catch(Exception e){try{return "{\"error\":"+JSONObject.quote(e.getClass().getSimpleName()+": "+String.valueOf(e.getMessage()))+"}";}catch(Exception ignored){return "{\"error\":\"Connection failed\"}";}}}}}
          EOF
          cp app/src/main/res/drawable/krishna_hud.png app/src/main/assets/krishna_hud.png
          cat > app/src/main/assets/index.html <<'EOF'
          <!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 42%,#063c58 0,#06131e 38%,#01060c 75%);color:#dffaff;font-family:Arial,sans-serif;overflow:hidden}.grid{position:fixed;inset:0;background-image:linear-gradient(#00cfff18 1px,transparent 1px),linear-gradient(90deg,#00cfff18 1px,transparent 1px);background-size:26px 26px;transform:perspective(450px) rotateX(58deg) scale(1.8);transform-origin:bottom;opacity:.45}.top{position:relative;text-align:center;padding:25px 16px 4px;letter-spacing:6px;font-weight:bold;font-size:27px;color:#6deaff;text-shadow:0 0 15px #00cfff}.sub{position:relative;text-align:center;color:#7ca4b5;font-size:10px;letter-spacing:3px}.reactor{position:relative;margin:26px auto 10px;width:205px;height:205px;animation:float 4s ease-in-out infinite}.ring{position:absolute;inset:8px;border:2px solid #25eaff;border-radius:50%;box-shadow:0 0 20px #00bfff,inset 0 0 22px #0099cc;animation:spin 11s linear infinite}.core{position:absolute;inset:40px;border-radius:50%;background:url('krishna_hud.png') center/cover;box-shadow:0 0 20px #00dfff,0 0 60px #00aaff;animation:spin 16s linear infinite reverse}.core:after{content:"KRISHNA";position:absolute;inset:0;display:grid;place-items:center;background:#00182888;border-radius:50%;font-size:18px;font-weight:bold}.panel{position:relative;margin:0 17px;border:1px solid #14ceeb;border-radius:14px;background:#041c2bdf;box-shadow:0 0 22px #007fa6;padding:12px}.signal{display:flex;justify-content:space-between;font-size:12px;letter-spacing:1px;margin:6px 0}.red{color:#ff5875}.green{color:#41ff9c}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}input,button,select{width:100%;border-radius:9px;padding:11px;margin-top:8px;font-size:14px}input,select{color:white;background:#03111d;border:1px solid #36dfff}button{background:linear-gradient(90deg,#009fc4,#00d7ee);border:0;color:#00141c;font-weight:bold;letter-spacing:1px}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-11px) rotateX(7deg)}}</style></head><body><div class="grid"></div><div class="top">KRISHNA</div><div class="sub">LOCAL + FREE CLOUD INTELLIGENCE</div><div class="reactor"><div class="ring"></div><div class="core"></div></div><div class="panel"><div class="signal">PC CONNECTION <span id="pc" class="red"><i class="dot"></i> NOT PAIRED</span></div><div class="signal">KRISHNA SYSTEM <span id="sys" class="red"><i class="dot"></i> CHECK REQUIRED</span></div><input id="pair" placeholder="Paste pairing code once"><button onclick="connect()">PAIR & TEST PC</button><select id="mode"><option value="local">Local PC model</option><option value="cloud">Free cloud gateway</option></select><input id="msg" placeholder="Talk to KRISHNA"><button onclick="send()">SEND TO KRISHNA</button><div id="reply" class="signal"></div></div><script>function set(id,ok,t){let e=document.getElementById(id);e.className=ok?'green':'red';e.innerHTML='<i class="dot"></i> '+t}function connect(){Krishna.pair(pair.value);let d=JSON.parse(Krishna.status());let ok=!d.error;set('pc',ok,ok?'CONNECTED':'OFFLINE');set('sys',ok,'RECOVERY '+(d.recovery?'ACTIVE':'CHECK'))}function send(){let q=msg.value.trim();if(!q)return;reply.textContent='KRISHNA is thinking…';let d=JSON.parse(Krishna.chat(q,mode.value==='cloud'));reply.textContent=d.error||d.reply||'No reply';if(!d.error)set('pc',true,'CONNECTED')}window.onerror=(m,s,l)=>{try{Krishna.log('JS '+m+' @ '+s+':'+l)}catch(e){}};window.onunhandledrejection=e=>{try{Krishna.log('Promise '+String(e.reason))}catch(x){}}</script></body></html>
          EOF
          cat > app/src/main/java/com/krishna/mobile/VoiceService.java <<'EOF'
          package com.krishna.mobile;import android.app.*;import android.content.*;import android.os.*;import android.speech.*;import java.util.*;public class VoiceService extends Service implements RecognitionListener{SpeechRecognizer r;Handler h=new Handler();public IBinder onBind(Intent i){return null;}public int onStartCommand(Intent i,int f,int id){NotificationChannel c=new NotificationChannel("k","KRISHNA",NotificationManager.IMPORTANCE_LOW);((NotificationManager)getSystemService(NOTIFICATION_SERVICE)).createNotificationChannel(c);startForeground(8,new Notification.Builder(this,"k").setContentTitle("KRISHNA listening").setSmallIcon(android.R.drawable.ic_btn_speak_now).build());r=SpeechRecognizer.createSpeechRecognizer(this);r.setRecognitionListener(this);go();return START_STICKY;}void go(){try{Intent i=new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);i.putExtra(RecognizerIntent.EXTRA_LANGUAGE,"or-IN");r.startListening(i);}catch(Exception e){h.postDelayed(()->go(),1500);}}public void onResults(Bundle b){ArrayList<String>x=b.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);if(x!=null)for(String q:x)if(q.toLowerCase().contains("krishna utha")){Intent a=new Intent(this,MainActivity.class);a.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);startActivity(a);}h.postDelayed(()->go(),700);}public void onError(int e){h.postDelayed(()->go(),1000);}public void onReadyForSpeech(Bundle b){}public void onBeginningOfSpeech(){}public void onRmsChanged(float f){}public void onBufferReceived(byte[]b){}public void onEndOfSpeech(){}public void onPartialResults(Bundle b){}public void onEvent(int a,Bundle b){}}
          EOF
          gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KRISHNA-Connected-3D-APK
          path: app/build/outputs/apk/debug/app-debug.apk
