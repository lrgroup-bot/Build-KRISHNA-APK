name: Build KRISHNA APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create KRISHNA Android app
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/krishna/mobile app/src/main/res/values app/src/main/res/xml app/src/main/res/drawable
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'KrishnaMobile'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.krishna.mobile'
            compileSdk 35
            defaultConfig {
              applicationId 'com.krishna.mobile'
              minSdk 26
              targetSdk 35
              versionCode 1
              versionName '1.0.0'
            }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:allowBackup="false" android:icon="@drawable/ic_krishna" android:label="KRISHNA" android:networkSecurityConfig="@xml/network_security_config" android:theme="@style/AppTheme">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">#b9f66a</item><item name="android:navigationBarColor">#07150d</item><item name="android:statusBarColor">#07150d</item></style></resources>
          EOF
          cat > app/src/main/res/xml/network_security_config.xml <<'EOF'
          <network-security-config><base-config cleartextTrafficPermitted="false"><trust-anchors><certificates src="system" /><certificates src="user" /></trust-anchors></base-config></network-security-config>
          EOF
          cat > app/src/main/java/com/krishna/mobile/MainActivity.java <<'EOF'
          package com.krishna.mobile;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public final class MainActivity extends Activity {
            private static final String KRISHNA_URL="https://192.168.0.106:8765/";
            @SuppressLint("SetJavaScriptEnabled") @Override public void onCreate(Bundle state) {
              super.onCreate(state); WebView view=new WebView(this);
              view.getSettings().setJavaScriptEnabled(true); view.getSettings().setDomStorageEnabled(true);
              view.setWebChromeClient(new WebChromeClient()); view.setWebViewClient(new WebViewClient());
              setContentView(view); view.loadUrl(KRISHNA_URL);
            }
            @Override public void onBackPressed() { WebView view=(WebView)((android.view.ViewGroup)findViewById(android.R.id.content)).getChildAt(0); if(view.canGoBack()) view.goBack(); else super.onBackPressed(); }
          }
          EOF
      - name: Add KRISHNA icon and build APK
        run: |
          cat > app/src/main/res/drawable/ic_krishna.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#0B1D11" android:pathData="M0,0h108v108h-108z"/><path android:fillColor="#B9F66A" android:pathData="M24,18h15v27l26,-27h19L53,50l34,40H67L39,57v33H24z"/><path android:fillColor="#FFFFFF" android:fillAlpha="0.22" android:pathData="M8,8h92v4h-92z"/></vector>
          EOF
          gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KRISHNA-Mobile-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
