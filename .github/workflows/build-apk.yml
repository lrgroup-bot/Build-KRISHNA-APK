name: Build KRISHNA APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create KRISHNA Android app
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/krishna/mobile app/src/main/res/values app/src/main/res/xml app/src/main/res/drawable
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'KrishnaMobile'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.krishna.mobile'; compileSdk 35
            defaultConfig { applicationId 'com.krishna.mobile'; minSdk 26; targetSdk 35; versionCode 3; versionName '1.2.0' }
          }
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">KRISHNA</string><style name="AppTheme" parent="android:style/Theme.Material.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">#A8FF3E</item><item name="android:windowLightStatusBar">false</item><item name="android:navigationBarColor">#06100A</item><item name="android:statusBarColor">#06100A</item></style></resources>
          EOF
          cat > app/src/main/res/xml/network_security_config.xml <<'EOF'
          <network-security-config><base-config cleartextTrafficPermitted="false"><trust-anchors><certificates src="system"/><certificates src="user"/></trust-anchors></base-config></network-security-config>
          EOF
          cat > app/src/main/res/drawable/ic_krishna.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#07120A" android:pathData="M0,0h108v108h-108z"/><path android:strokeColor="#A8FF3E" android:strokeWidth="4" android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="@android:color/transparent" android:pathData="M28,21v66M29,53L74,22M31,54L76,87"/><path android:fillColor="#A8FF3E" android:pathData="M73,20a7,7 0,1 0,0.1 0"/></vector>
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/AppTheme" android:label="KRISHNA" android:icon="@drawable/ic_krishna" android:networkSecurityConfig="@xml/network_security_config" android:usesCleartextTraffic="false"><activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > app/src/main/java/com/krishna/mobile/MainActivity.java <<'EOF'
          package com.krishna.mobile;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.graphics.Color;
          import android.net.http.SslError;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.webkit.JavascriptInterface;
          import android.webkit.SslErrorHandler;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {
            private WebView panel;
            private static final String HOME = """
            <!doctype html><html><head><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'>
            <style>
            *{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 38%,#173b23 0,#08140d 36%,#020604 75%);color:#eaffdf;font-family:Arial,sans-serif;letter-spacing:.08em}.grid{position:fixed;inset:0;background-image:linear-gradient(#a8ff3e12 1px,transparent 1px),linear-gradient(90deg,#a8ff3e12 1px,transparent 1px);background-size:28px 28px;transform:perspective(400px) rotateX(58deg) scale(1.8) translateY(28%);opacity:.55}.top{position:relative;text-align:center;padding:38px 20px 4px}.top small{color:#a8ff3e;font-size:10px}.top h1{font-size:29px;margin:9px 0 0;letter-spacing:.26em;text-shadow:0 0 18px #a8ff3e}.core{position:relative;width:245px;height:245px;margin:27px auto 20px;display:grid;place-items:center;filter:drop-shadow(0 0 18px #86ff36)}.ring{position:absolute;border:2px solid #a8ff3e;border-radius:50%;box-shadow:0 0 16px #7aff2a, inset 0 0 18px #69d822}.r1{width:230px;height:230px;border-style:dashed;animation:spin 10s linear infinite}.r2{width:177px;height:177px;border-color:#d8ffac66;animation:spin 6s linear infinite reverse}.r3{width:111px;height:111px;animation:pulse 2s ease-in-out infinite}.dot{width:42px;height:42px;border-radius:50%;background:#c7ff82;box-shadow:0 0 28px 12px #a8ff3e;color:#10250b;display:grid;place-items:center;font-weight:bold;font-size:25px}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(.75);opacity:.45}}.state{position:relative;text-align:center;font-size:11px;color:#baff7c;margin:3px auto 22px;padding:8px;border-top:1px solid #a8ff3e55;border-bottom:1px solid #a8ff3e55;width:82%}.card{position:relative;margin:0 22px;padding:16px;border:1px solid #a8ff3e88;background:#06140bcc;box-shadow:0 0 25px #8cff261f}.card label{font-size:10px;color:#baff7c}.card input{margin:9px 0 12px;width:100%;background:#020704;border:1px solid #a8ff3e88;color:#eaffdf;padding:13px;font-size:12px;outline:none}.card button{width:100%;border:0;background:#a8ff3e;color:#07120a;font-weight:bold;letter-spacing:.16em;padding:14px}.hint{position:relative;text-align:center;font-size:10px;line-height:1.6;color:#b7cab4;padding:15px 30px}.footer{position:relative;text-align:center;color:#78a56b;font-size:9px;margin-top:2px}.scan{position:absolute;inset:0;background:linear-gradient(transparent 49%,#c8ff7b15 50%,transparent 51%);background-size:100% 6px;pointer-events:none}
            </style></head><body><div class='grid'></div><div class='scan'></div><div class='top'><small>AUTONOMOUS ASSISTANT INTERFACE</small><h1>KRISHNA</h1></div><div class='core'><div class='ring r1'></div><div class='ring r2'></div><div class='ring r3'></div><div class='dot'>K</div></div><div class='state'>__STATUS__</div><div class='card'><label>SECURE KRISHNA PAIRING LINK</label><input id='link' placeholder='https://your-PC:8765/#pairing-token'><button onclick='Krishna.connect(document.getElementById("link").value)'>CONNECT TO KRISHNA</button></div><div class='hint'>Paste the private pairing link created on your KRISHNA PC. Your link stays on this phone.</div><div class='footer'>LOCAL • PRIVATE • FREE ROUTING READY</div></body></html>
            """;

            @Override public void onCreate(Bundle savedInstanceState) { super.onCreate(savedInstanceState); showHome("SYSTEM READY • AWAITING SECURE LINK"); }
            @SuppressLint("SetJavaScriptEnabled") private WebView makeWebView() { WebView v=new WebView(this); v.setLayoutParams(new ViewGroup.LayoutParams(-1,-1)); v.getSettings().setJavaScriptEnabled(true); v.getSettings().setDomStorageEnabled(true); v.setBackgroundColor(Color.rgb(2,6,4)); return v; }
            private void showHome(String status) { panel=makeWebView(); panel.addJavascriptInterface(new Bridge(),"Krishna"); panel.loadDataWithBaseURL("https://krishna.local/", HOME.replace("__STATUS__",status),"text/html","UTF-8",null); setContentView(panel); }
            private void openKrishna(String address) { panel=makeWebView(); panel.setWebViewClient(new WebViewClient(){ @Override public void onReceivedSslError(WebView v,SslErrorHandler h,SslError e){ h.cancel(); showHome("SECURE CERTIFICATE REQUIRED • INSTALL KRISHNA CA"); Toast.makeText(MainActivity.this,"KRISHNA certificate required",Toast.LENGTH_LONG).show(); } @Override public void onReceivedError(WebView v,WebResourceRequest r,WebResourceError e){ if(r.isForMainFrame()){ showHome("KRISHNA PC NOT REACHABLE • CHECK WI-FI"); } } }); setContentView(panel); panel.loadUrl(address); }
            @Override public void onBackPressed(){ showHome("SYSTEM READY • AWAITING SECURE LINK"); }
            private class Bridge { @JavascriptInterface public void connect(String address){ if(address==null || !(address.startsWith("https://")||address.startsWith("http://"))){ runOnUiThread(()->showHome("ENTER A VALID KRISHNA LINK")); return; } runOnUiThread(()->openKrishna(address.trim())); } }
          }
          EOF
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: KRISHNA-JARVIS-Mobile-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
