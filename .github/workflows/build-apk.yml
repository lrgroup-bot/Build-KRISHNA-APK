name: Build KRISHNA APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build
        run: |
          mkdir -p app/src/main/java/com/krishna/mobile app/src/main/res/{values,drawable,xml,raw} app/src/main/assets
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google();mavenCentral();gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google();mavenCentral() } }
          rootProject.name='Krishna';include ':app'
          EOF
          echo "plugins { id 'com.android.application' version '8.7.3' apply false }" > build.gradle
          echo 'org.gradle.jvmargs=-Xmx2048m' > gradle.properties
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.krishna.mobile'; compileSdk 35
          defaultConfig { applicationId 'com.krishna.mobile'; minSdk 26; targetSdk 35; versionCode 8; versionName '1.4.3' } }
          EOF
          echo '<resources><string name="app_name">KRISHNA</string><style name="AppTheme" parent="android:style/Theme.Material.NoActionBar"/></resources>' > app/src/main/res/values/styles.xml
          echo '<shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#06182A"/><corners android:radius="24dp"/><stroke android:width="2dp" android:color="#00C8FF"/></shape>' > app/src/main/res/drawable/field.xml
          echo '<network-security-config><base-config><trust-anchors><certificates src="system"/><certificates src="user"/><certificates src="@raw/krishna_ca"/></trust-anchors></base-config></network-security-config>' > app/src/main/res/xml/network_security_config.xml
          cp app/src/main/res/raw/krishna-ca.cer app/src/main/res/raw/krishna_ca.cer
          rm app/src/main/res/raw/krishna-ca.cer
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/><application android:theme="@style/AppTheme" android:label="KRISHNA" android:icon="@drawable/krishna_hud" android:usesCleartextTraffic="true" android:networkSecurityConfig="@xml/network_security_config"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><service android:name=".VoiceService" android:foregroundServiceType="microphone"/></application></manifest>
          EOF
          cat > app/src/main/java/com/krishna/mobile/MainActivity.java <<'EOF'
          package com.krishna.mobile;import android.app.*;import android.os.*;import android.content.*;import android.content.pm.PackageManager;import android.webkit.*;import java.net.*;public class MainActivity extends Activity{void startVoice(){startForegroundService(new Intent(this,VoiceService.class));}public void onCreate(Bundle b){super.onCreate(b);WebView w=new WebView(this);w.getSettings().setJavaScriptEnabled(true);w.getSettings().setDomStorageEnabled(true);w.addJavascriptInterface(new Bridge(),"Krishna");setContentView(w);w.loadUrl("file:///android_asset/index.html");if(Build.VERSION.SDK_INT>=23&&checkSelfPermission(android.Manifest.permission.RECORD_AUDIO)!=PackageManager.PERMISSION_GRANTED)requestPermissions(new String[]{android.Manifest.permission.RECORD_AUDIO},42);else startVoice();}public void onRequestPermissionsResult(int r,String[]p,int[]g){super.onRequestPermissionsResult(r,p,g);if(r==42&&g.length>0&&g[0]==PackageManager.PERMISSION_GRANTED)startVoice();}public class Bridge{@JavascriptInterface public String checkPc(){try{HttpURLConnection c=(HttpURLConnection)new URL("http://192.168.0.106:8765/api/status").openConnection();c.setConnectTimeout(2500);c.setReadTimeout(2500);return c.getResponseCode()==200?"ONLINE":"OFFLINE";}catch(Exception e){return "OFFLINE";}}}}
          EOF
          cp app/src/main/res/drawable/krishna_hud.png app/src/main/assets/krishna_hud.png
          cat > app/src/main/assets/index.html <<'EOF'
          <!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
          *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 42%,#063c58 0,#06131e 38%,#01060c 75%);color:#dffaff;font-family:Arial,sans-serif;overflow:hidden}.grid{position:fixed;inset:0;background-image:linear-gradient(#00cfff18 1px,transparent 1px),linear-gradient(90deg,#00cfff18 1px,transparent 1px);background-size:26px 26px;transform:perspective(450px) rotateX(58deg) scale(1.8);transform-origin:bottom;opacity:.45}.top{position:relative;text-align:center;padding:25px 16px 4px;letter-spacing:6px;font-weight:bold;font-size:27px;color:#6deaff;text-shadow:0 0 15px #00cfff}.sub{position:relative;text-align:center;color:#7ca4b5;font-size:10px;letter-spacing:3px}.reactor{position:relative;margin:32px auto 16px;width:235px;height:235px;transform-style:preserve-3d;animation:float 4s ease-in-out infinite}.ring{position:absolute;inset:8px;border:2px solid #25eaff;border-radius:50%;box-shadow:0 0 20px #00bfff,inset 0 0 22px #0099cc;animation:spin 11s linear infinite}.ring:before,.ring:after{content:"";position:absolute;border:1px solid #7af5ff;border-radius:50%;inset:25px;transform:rotateX(67deg)}.ring:after{inset:50px;transform:rotateY(67deg)}.core{position:absolute;inset:42px;border-radius:50%;background:url('krishna_hud.png') center/cover;box-shadow:0 0 20px #00dfff,0 0 60px #00aaff;animation:spin 16s linear infinite reverse}.core:after{content:"KRISHNA";position:absolute;inset:0;display:grid;place-items:center;background:#00182888;border-radius:50%;font-size:19px;font-weight:bold;text-shadow:0 0 10px #00e5ff}.panel{position:relative;margin:0 17px;border:1px solid #14ceeb;border-radius:14px;background:#041c2bdf;box-shadow:0 0 22px #007fa6;padding:14px}.signal{display:flex;justify-content:space-between;font-size:12px;letter-spacing:1px;margin:6px 0}.red{color:#ff5875}.green{color:#41ff9c}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}input,button{width:100%;border-radius:9px;padding:13px;margin-top:10px;font-size:15px}input{color:white;background:#03111d;border:1px solid #36dfff}button{background:linear-gradient(90deg,#009fc4,#00d7ee);border:0;color:#00141c;font-weight:bold;letter-spacing:1px}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-11px) rotateX(7deg)}}
          </style></head><body><div class="grid"></div><div class="top">KRISHNA</div><div class="sub">CONNECTED INTELLIGENCE</div><div class="reactor"><div class="ring"></div><div class="core"></div></div><div class="panel"><div class="signal">PC CONNECTION <span id="pc" class="red"><i class="dot"></i> NOT TESTED</span></div><div class="signal">KRISHNA SYSTEM <span class="green"><i class="dot"></i> READY</span></div><input id="msg" placeholder="Talk to KRISHNA"><button onclick="testPc()">TEST PC CONNECTION</button></div><script>function testPc(){let e=document.getElementById('pc');e.className='red';e.innerHTML='<i class="dot"></i> TESTING';setTimeout(()=>{let r=Krishna.checkPc();e.className=r==='ONLINE'?'green':'red';e.innerHTML='<i class="dot"></i> '+r},50)}</script></body></html>
          EOF          cat > app/src/main/java/com/krishna/mobile/VoiceService.java <<'EOF'
          package com.krishna.mobile;import android.app.*;import android.content.*;import android.os.*;import android.speech.*;import java.util.*;public class VoiceService extends Service implements RecognitionListener{SpeechRecognizer r;Handler h=new Handler();public IBinder onBind(Intent i){return null;}public int onStartCommand(Intent i,int f,int id){NotificationChannel c=new NotificationChannel("k","KRISHNA",NotificationManager.IMPORTANCE_LOW);((NotificationManager)getSystemService(NOTIFICATION_SERVICE)).createNotificationChannel(c);startForeground(8,new Notification.Builder(this,"k").setContentTitle("KRISHNA listening").setSmallIcon(android.R.drawable.ic_btn_speak_now).build());r=SpeechRecognizer.createSpeechRecognizer(this);r.setRecognitionListener(this);go();return START_STICKY;}void go(){try{Intent i=new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);i.putExtra(RecognizerIntent.EXTRA_LANGUAGE,"or-IN");r.startListening(i);}catch(Exception e){h.postDelayed(()->go(),1500);}}public void onResults(Bundle b){ArrayList<String>x=b.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);if(x!=null)for(String q:x)if(q.toLowerCase().contains("krishna utha")){Intent a=new Intent(this,MainActivity.class);a.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);startActivity(a);}h.postDelayed(()->go(),700);}public void onError(int e){h.postDelayed(()->go(),1000);}public void onReadyForSpeech(Bundle b){}public void onBeginningOfSpeech(){}public void onRmsChanged(float f){}public void onBufferReceived(byte[]b){}public void onEndOfSpeech(){}public void onPartialResults(Bundle b){}public void onEvent(int a,Bundle b){}}
          EOF
          gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KRISHNA-3D-Status-APK
          path: app/build/outputs/apk/debug/app-debug.apk
