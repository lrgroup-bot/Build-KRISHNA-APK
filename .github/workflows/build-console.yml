name: Build KRISHNA Windows Console

on:
  push:
    branches:
      - feature/autonomous-browser-research
      - fix/krishna-exe-core-start
      - main
    paths:
      - 'core/**'
      - '.github/workflows/build-console.yml'
  workflow_dispatch:

jobs:
  build-console:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install console dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller playwright

      - name: Build KRISHNA.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile `
            --name KRISHNA `
            --paths core `
            --collect-submodules krishna_core `
            --collect-all playwright `
            --add-data "core/dashboard.html;." `
            --add-data "avatar/krishna_child_360.webp.b64;avatar" `
            core/krishna_console.py

      - name: Smoke test executable
        shell: pwsh
        run: |
          if (!(Test-Path "dist/KRISHNA.exe")) { throw "KRISHNA.exe missing" }
          $size=(Get-Item "dist/KRISHNA.exe").Length
          if ($size -lt 1000000) { throw "KRISHNA.exe unexpectedly small" }
          Write-Host "KRISHNA.exe bytes: $size"
          $commands = "/status`n/exit`n"
          $commands | & .\dist\KRISHNA.exe *> krishna-console-smoke.txt
          $output = Get-Content krishna-console-smoke.txt -Raw
          Write-Host $output
          if ($output -notmatch "Core connected") { throw "KRISHNA Core did not auto-start inside EXE" }
          if ($output -notmatch '"core": "ONLINE"') { throw "KRISHNA /status did not report Core ONLINE" }

      - uses: actions/upload-artifact@v4
        with:
          name: KRISHNA-Windows-Console
          path: dist/KRISHNA.exe
