name: Build KRISHNA Windows App

on:
  push:
    branches:
      - feature/autonomous-browser-research
      - fix/krishna-exe-core-start
      - feature/mobile-pc-control-safe-patch
      - main
    paths:
      - 'core/**'
      - 'avatar/**'
      - 'scripts/**'
      - '.github/workflows/build-console.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Windows app dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller playwright

      - name: Compile sources
        shell: pwsh
        run: |
          python -m py_compile core/krishna_console.py core/krishna_desktop.py
          python -m compileall -q core/krishna_core
          [void][scriptblock]::Create((Get-Content scripts/PATCH_KRISHNA_V3.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content scripts/START_KRISHNA.ps1 -Raw))
          Write-Host "PowerShell scripts parsed successfully"

      - name: Build KRISHNA desktop app
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name KRISHNA `
            --paths core `
            --collect-submodules krishna_core `
            --collect-all playwright `
            --add-data "core/dashboard.html;." `
            --add-data "avatar/krishna_child_360.webp.b64;avatar" `
            core/krishna_desktop.py

      - name: Build KRISHNA console fallback
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile `
            --name KRISHNA-Console `
            --paths core `
            --collect-submodules krishna_core `
            --collect-all playwright `
            --add-data "core/dashboard.html;." `
            --add-data "avatar/krishna_child_360.webp.b64;avatar" `
            core/krishna_console.py

      - name: Verify safe v3 patch preserves protected data
        shell: pwsh
        run: |
          $pkg=(Get-Location).Path
          $target=Join-Path $env:RUNNER_TEMP "KRISHNA-v3-test"
          New-Item -ItemType Directory -Force -Path (Join-Path $target "core") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $target "certificates") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $target "state") | Out-Null
          Set-Content -LiteralPath (Join-Path $target "krishna.glb") -Value "KEEP-GLB"
          Set-Content -LiteralPath (Join-Path $target "core\krishna.py") -Value "KEEP-KRISHNA-PY"
          Set-Content -LiteralPath (Join-Path $target "certificates\owner.cer") -Value "KEEP-CERT"
          Set-Content -LiteralPath (Join-Path $target "state\owner.json") -Value "KEEP-STATE"
          & .\scripts\PATCH_KRISHNA_V3.ps1 -PackageRoot $pkg -TargetRoot $target
          if ((Get-Content (Join-Path $target "krishna.glb") -Raw).Trim() -ne "KEEP-GLB") { throw "krishna.glb changed" }
          if ((Get-Content (Join-Path $target "core\krishna.py") -Raw).Trim() -ne "KEEP-KRISHNA-PY") { throw "core\krishna.py changed" }
          if ((Get-Content (Join-Path $target "certificates\owner.cer") -Raw).Trim() -ne "KEEP-CERT") { throw "certificate changed" }
          if ((Get-Content (Join-Path $target "state\owner.json") -Raw).Trim() -ne "KEEP-STATE") { throw "state changed" }
          if (!(Test-Path (Join-Path $target "core\krishna_console.py"))) { throw "missing v3 runtime was not installed" }

      - name: Live smoke test bundled Core
        shell: pwsh
        run: |
          if (!(Test-Path "dist/KRISHNA.exe")) { throw "KRISHNA.exe missing" }
          if (!(Test-Path "dist/KRISHNA-Console.exe")) { throw "KRISHNA-Console.exe missing" }
          $size=(Get-Item "dist/KRISHNA.exe").Length
          if ($size -lt 1000000) { throw "KRISHNA.exe unexpectedly small" }
          Write-Host "KRISHNA.exe bytes: $size"
          $commands = "/status`n/chats`n/engines`n/exit`n"
          $commands | & .\dist\KRISHNA-Console.exe *> krishna-console-smoke.txt
          $output = Get-Content krishna-console-smoke.txt -Raw
          Write-Host $output
          if ($output -notmatch "Core connected") { throw "KRISHNA Core did not auto-start inside EXE" }
          if ($output -notmatch '"core": "ONLINE"') { throw "KRISHNA /status did not report Core ONLINE" }
          if ($output -notmatch 'persistent_project_chats') { throw "KRISHNA project-chat engine missing" }
          if ($output -notmatch 'chromium_ui_inspection') { throw "KRISHNA browser engine missing" }
          if ($output -notmatch 'github_repository_research') { throw "KRISHNA research engine missing" }
          python -m unittest discover -s core/tests -p "test_*.py"

      - uses: actions/upload-artifact@v4
        with:
          name: KRISHNA-Windows-App
          path: |
            dist/KRISHNA.exe
            dist/KRISHNA-Console.exe
            scripts/PATCH_KRISHNA_V3.ps1
            scripts/START_KRISHNA.ps1
