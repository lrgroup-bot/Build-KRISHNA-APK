<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KRISHNA PC</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 18%,#10355255,transparent 28%),#050b12;color:#dffaff;font-family:Segoe UI,Arial}
.wrap{max-width:1280px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center}.brand{letter-spacing:7px;font-size:28px;color:#f1cc77;font-weight:800}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#777;margin-right:8px}.on{background:#4dff9a;box-shadow:0 0 14px #4dff9a}
.hero{margin-top:18px;display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:18px;align-items:stretch}
.avatarCard,.card{border:1px solid #123a4b;background:#071722;border-radius:18px;box-shadow:0 0 20px #001}
.avatarCard{position:relative;min-height:610px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.halo{position:absolute;width:76%;aspect-ratio:1;border:2px solid #f2c96f77;border-radius:50%;box-shadow:0 0 55px #43bff244}
.avatarViewport{position:relative;height:560px;aspect-ratio:1/3;overflow:hidden;filter:drop-shadow(0 18px 24px #000a);z-index:2;user-select:none;cursor:grab}
.avatarViewport:active{cursor:grabbing}.sprite{height:100%;width:800%;display:block;transform:translateX(0);transition:transform .18s ease-out;pointer-events:none}
.viewLabel{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:4;font-size:10px;letter-spacing:2px;color:#f4d88b;background:#020914c8;border:1px solid #8b733c66;border-radius:20px;padding:6px 10px}
.rotateHint{position:absolute;top:14px;left:14px;color:#78aebf;font-size:10px;letter-spacing:1.4px;z-index:3}
.statusSide{display:flex;flex-direction:column;gap:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:14px}
.card{padding:18px}.wide{grid-column:1/-1}.k{font-size:11px;letter-spacing:2px;color:#75a9b8}.v{font-size:22px;margin-top:8px}.small{font-size:15px}.log{font-family:Consolas,monospace;white-space:pre-wrap;max-height:280px;overflow:auto;font-size:13px;color:#b9e9f2}
.muted{color:#71909a;font-size:12px}.good{color:#50f0ac}.bad{color:#ff7189}
@media(max-width:850px){.hero{grid-template-columns:1fr}.avatarCard{min-height:520px}.avatarViewport{height:480px}.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div class="top"><div class="brand">KRISHNA</div><div><span id="dot" class="dot"></span><span id="live">CHECKING</span></div></div>
<div class="hero">
  <div class="avatarCard">
    <div class="halo"></div><div class="rotateHint">DRAG TO ROTATE · 360°</div>
    <div id="avatarViewport" class="avatarViewport"><img id="avatarSprite" class="sprite" src="/api/avatar360" alt="KRISHNA child avatar"><div id="viewLabel" class="viewLabel">FRONT</div></div>
  </div>
  <div class="statusSide">
    <div class="grid">
      <div class="card"><div class="k">CORE</div><div id="core" class="v">—</div></div>
      <div class="card"><div class="k">MOBILE LINK</div><div id="mobile" class="v">—</div></div>
      <div class="card"><div class="k">WATCHER</div><div id="watcher" class="v small">—</div></div>
      <div class="card"><div class="k">PC RESOURCES</div><div id="resources" class="v small">—</div></div>
      <div class="card wide"><div class="k">CURRENT ACTIVITY</div><div id="activity" class="v">—</div></div>
      <div class="card wide"><div class="k">RECENT ACTIVITY</div><div id="log" class="log">Waiting for KRISHNA…</div></div>
    </div>
    <p class="muted">KRISHNA PC · live 360 child avatar · drag avatar to rotate · system state refreshes every 2 seconds.</p>
  </div>
</div></div>
<script>
const labels=['FRONT','FRONT-RIGHT','RIGHT','BACK-RIGHT','BACK','BACK-LEFT','LEFT','FRONT-LEFT'];
let view=0,drag=false,startX=0,startView=0,lastManual=0;
const sprite=document.getElementById('avatarSprite'),vp=document.getElementById('avatarViewport'),vl=document.getElementById('viewLabel');
function showView(i,manual=false){view=(i%8+8)%8;sprite.style.transform='translateX('+(-view*12.5)+'%)';vl.textContent=labels[view];if(manual)lastManual=Date.now()}
vp.addEventListener('pointerdown',e=>{drag=true;startX=e.clientX;startView=view;vp.setPointerCapture(e.pointerId)});
vp.addEventListener('pointermove',e=>{if(!drag)return;showView(startView+Math.round(-(e.clientX-startX)/38),true)});
vp.addEventListener('pointerup',()=>drag=false);vp.addEventListener('pointercancel',()=>drag=false);
setInterval(()=>{if(!drag&&Date.now()-lastManual>5000)showView(view+1,false)},2800);
async function tick(){try{
 let r=await fetch('/api/dashboard',{cache:'no-store'}),d=await r.json();
 dot.className='dot '+(d.active?'on':'');live.textContent=d.active?'ACTIVE':'IDLE';core.textContent=d.core||'UNKNOWN';
 const ml=d.mobile_connection||{};mobile.textContent=ml.connected?'CONNECTED':'OFFLINE';mobile.className='v '+(ml.connected?'good':'bad');
 watcher.textContent=(d.watcher&&d.watcher.targets)?Object.entries(d.watcher.targets).map(([k,v])=>k+': '+(v.ok?'UP':'DOWN')).join(' · '):'READY';
 const p=d.pc_observer||{},g=d.resources||{};resources.textContent='CPU '+(p.cpu_percent??'—')+'% · RAM '+(p.memory_percent??'—')+'% · jobs '+(g.active_jobs??0);
 activity.textContent=d.current_activity||'Idle';log.textContent=(d.recent||[]).map(x=>'['+(x.time||'')+'] '+(x.event||x)).join('\n')||'No activity yet';
}catch(e){live.textContent='OFFLINE';core.textContent='OFFLINE';mobile.textContent='OFFLINE';mobile.className='v bad'}}
showView(0);tick();setInterval(tick,2000);
</script></body></html>
