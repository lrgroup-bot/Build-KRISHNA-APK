<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KRISHNA PC</title><style>
body{margin:0;background:#050b12;color:#dffaff;font-family:Segoe UI,Arial}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.brand{letter-spacing:7px;font-size:28px;color:#7deeff}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#777;margin-right:8px}.on{background:#4dff9a;box-shadow:0 0 14px #4dff9a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:22px}.card{border:1px solid #123a4b;background:#071722;border-radius:16px;padding:18px;box-shadow:0 0 20px #001}.k{font-size:11px;letter-spacing:2px;color:#75a9b8}.v{font-size:22px;margin-top:8px}.wide{grid-column:1/-1}.log{font-family:Consolas,monospace;white-space:pre-wrap;max-height:360px;overflow:auto;font-size:13px;color:#b9e9f2}.muted{color:#71909a;font-size:12px}</style></head><body><div class="wrap"><div class="top"><div class="brand">KRISHNA</div><div><span id="dot" class="dot"></span><span id="live">CHECKING</span></div></div><div class="grid"><div class="card"><div class="k">CORE</div><div id="core" class="v">—</div></div><div class="card"><div class="k">WATCHER</div><div id="watcher" class="v">—</div></div><div class="card"><div class="k">CURRENT ACTIVITY</div><div id="activity" class="v">—</div></div><div class="card"><div class="k">LAST UPDATE</div><div id="updated" class="v">—</div></div><div class="card wide"><div class="k">RECENT ACTIVITY</div><div id="log" class="log">Waiting for KRISHNA…</div></div></div><p class="muted">Local PC monitoring dashboard. Refreshes every 2 seconds.</p></div><script>
async function tick(){try{let r=await fetch('/api/dashboard',{cache:'no-store'}),d=await r.json();document.getElementById('dot').className='dot '+(d.active?'on':'');live.textContent=d.active?'ACTIVE':'IDLE';core.textContent=d.core||'UNKNOWN';watcher.textContent=d.watcher||'UNKNOWN';activity.textContent=d.current_activity||'Idle';updated.textContent=d.updated||'—';log.textContent=(d.recent||[]).map(x=>'['+(x.time||'')+'] '+(x.event||x)).join('\n')||'No activity yet'}catch(e){live.textContent='OFFLINE';core.textContent='OFFLINE'}}tick();setInterval(tick,2000)</script></body></html>
