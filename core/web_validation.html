<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KRISHNA Web Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050b12;color:#e5eefb;font:14px Segoe UI,Arial}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#07131f;border-right:1px solid #173247;padding:18px}.brand{color:#f1cc77;font-size:23px;font-weight:800;letter-spacing:5px}.sub{color:#7892a8;font-size:11px;margin:6px 0 20px}.nav button,.actions button{width:100%;text-align:left;margin:4px 0;background:#0b1d2c;color:#dffaff;border:1px solid #173b51;border-radius:9px;padding:10px;cursor:pointer}.nav button:hover,.actions button:hover{background:#102b40}.main{padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{border:1px solid #23475c;border-radius:30px;padding:7px 12px;color:#90b8c9}.ok{color:#5cf0a8}.bad{color:#ff758b}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.card{background:#071722;border:1px solid #153b4e;border-radius:14px;padding:14px}.k{font-size:10px;letter-spacing:1.6px;color:#789bad}.v{font-size:18px;margin-top:7px}.workspace{display:grid;grid-template-columns:1fr 360px;gap:12px}.chat{min-height:530px;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;max-height:470px;white-space:pre-wrap}.msg{padding:10px 12px;margin:7px 0;border-radius:11px;background:#0b2030}.msg.you{background:#12365b}.composer{display:flex;gap:8px;margin-top:10px}.composer textarea{flex:1;background:#07111b;color:#fff;border:1px solid #24485d;border-radius:10px;padding:10px;resize:vertical}.composer button{background:#126c87;color:#fff;border:0;border-radius:10px;padding:0 18px}.log{font:12px Consolas,monospace;white-space:pre-wrap;overflow:auto;max-height:350px;color:#b7dbe7}.projectRow{display:flex;gap:8px;margin:10px 0}.projectRow select{flex:1;background:#07111b;color:#fff;border:1px solid #24485d;border-radius:8px;padding:8px}.test{font:12px Consolas,monospace}.test div{padding:6px;border-bottom:1px solid #102c3d}@media(max-width:950px){.app{grid-template-columns:1fr}.side{display:none}.grid{grid-template-columns:repeat(2,1fr)}.workspace{grid-template-columns:1fr}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand">KRISHNA</div><div class="sub">WEB-FIRST VALIDATION LAB</div>
<div class="nav"><button onclick="showSudarshan()">☸ Sudarshan</button><button onclick="showPlugins()">Plugins</button><button onclick="runAll()">▶ Run full web check</button><button onclick="tool('/api/capabilities')">Core engines</button><button onclick="tool('/api/projects')">Projects</button><button onclick="tool('/api/incidents')">Incidents</button><button onclick="tool('/api/core/neural-state')">Neural state</button><button onclick="tool('/api/resources')">Resources</button></div>
<div class="actions"><button onclick="indexProject()">Index selected project</button><button onclick="investigate()">Investigate problem</button><button onclick="inspectUI()">Inspect web UI</button><button onclick="research()">Research GitHub</button></div></aside>
<main class="main"><div class="top"><div><h2 style="margin:0">KRISHNA Web Control Room</h2><div class="sub">Test the real Core before packaging APK / EXE</div></div><div id="online" class="pill">CHECKING</div></div>
<div class="grid"><div class="card"><div class="k">CORE</div><div id="core" class="v">—</div></div><div class="card"><div class="k">CPU / RAM</div><div id="res" class="v">—</div></div><div class="card"><div class="k">PROJECTS</div><div id="projectsCount" class="v">—</div></div><div class="card"><div class="k">WEB TEST</div><div id="testState" class="v">NOT RUN</div></div></div>
<div class="projectRow"><select id="project"></select><button onclick="loadChats()">Load chats</button><button onclick="newChat()">+ Chat</button></div>
<div id="pluginPanel" class="card" style="display:none;margin-bottom:12px"><div class="k">PLUGINS · ADD WHAT YOU NEED</div><div class="projectRow"><input id="pluginName" placeholder="Plugin name" style="flex:1;background:#07111b;color:#fff;border:1px solid #24485d;border-radius:8px;padding:8px"><select id="pluginKind"><option>connector</option><option>local</option><option>http</option><option>mcp</option><option>custom</option></select><input id="pluginEndpoint" placeholder="Endpoint / identifier (optional)" style="flex:2;background:#07111b;color:#fff;border:1px solid #24485d;border-radius:8px;padding:8px"><button onclick="addPlugin()">+ Add plugin</button></div><div id="plugins"></div></div><div class="workspace"><section class="card chat"><div class="k">CONVERSATION</div><div id="messages" class="messages"></div><div class="composer"><textarea id="input" rows="3" placeholder="Ask KRISHNA…"></textarea><button onclick="send()">Send</button></div></section>
<section><div class="card"><div class="k">AUTOMATED CHECKS</div><div id="tests" class="test">Not run yet.</div></div><div class="card" style="margin-top:12px"><div class="k">TOOL / ACTIVITY OUTPUT</div><div id="log" class="log">Ready.</div></div></section></div></main></div>
<script>
let chatId=null, projects=[];
const $=id=>document.getElementById(id);
async function req(path,payload){const o={headers:{Accept:'application/json','X-Krishna-Device':'web-validation'}};if(payload!==undefined){o.method='POST';o.headers['Content-Type']='application/json';o.body=JSON.stringify(payload)}const r=await fetch(path,o);let d={};try{d=await r.json()}catch(e){d={error:'invalid JSON'}}if(!r.ok)throw new Error((d&&d.error)||('HTTP '+r.status));return d}
function log(x){$('log').textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}
async function refresh(){try{const [s,p]=await Promise.all([req('/api/status'),req('/api/projects')]);$('online').textContent='CORE ONLINE';$('online').className='pill ok';$('core').textContent=s.core||'ONLINE';const po=s.pc_observer||{};$('res').textContent=(po.cpu_percent??'—')+'% / '+(po.memory_percent??'—')+'%';projects=p.projects||[];$('projectsCount').textContent=projects.length;const sel=$('project'),old=sel.value;sel.innerHTML='';[{name:'general'},...projects.filter(x=>x.name!=='general')].forEach(x=>{const o=document.createElement('option');o.value=x.name;o.textContent=x.name;sel.appendChild(o)});if([...sel.options].some(o=>o.value===old))sel.value=old;if(!chatId)loadChats()}catch(e){$('online').textContent='CORE OFFLINE';$('online').className='pill bad';$('core').textContent='OFFLINE';log(e.message)}}
async function loadChats(){try{const project=$('project').value||'general';let d=await req('/api/chats?project='+encodeURIComponent(project));let rows=d.chats||[];if(!rows.length){const c=await req('/api/chats/create',{project,title:'Web validation'});rows=[c]}chatId=rows[0].chat_id;const h=await req('/api/chat/history?chat_id='+encodeURIComponent(chatId));$('messages').innerHTML='';(h.messages||[]).forEach(m=>addMsg(m.role,m.content))}catch(e){log(e.message)}}
function addMsg(role,text){const d=document.createElement('div');d.className='msg '+(role==='user'?'you':'');d.textContent=(role==='user'?'YOU: ':'KRISHNA: ')+text;$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight}
async function newChat(){try{const c=await req('/api/chats/create',{project:$('project').value||'general',title:'Web '+new Date().toLocaleTimeString()});chatId=c.chat_id;$('messages').innerHTML=''}catch(e){log(e.message)}}
async function send(){const t=$('input').value.trim();if(!t)return;if(!chatId)await loadChats();$('input').value='';addMsg('user',t);try{const d=await req('/api/core/chat',{message:t,project:$('project').value||'general',chat_id:chatId,source:'web'});addMsg('assistant',d.reply||d.text||JSON.stringify(d));log(d)}catch(e){addMsg('assistant','ERROR: '+e.message);log(e.message)}}
async function tool(path){try{log(await req(path))}catch(e){log(e.message)}}
function showSudarshan(){$('pluginPanel').style.display='none'}
async function showPlugins(){$('pluginPanel').style.display='block';await loadPlugins()}
async function loadPlugins(){try{const d=await req('/api/plugins');const box=$('plugins');box.innerHTML='';(d.plugins||[]).forEach(p=>{const row=document.createElement('div');row.className='msg';const b=document.createElement('button');b.textContent=p.enabled?'Disable':'Enable';b.onclick=async()=>{await req('/api/plugins/enable',{id:p.id,enabled:!p.enabled});loadPlugins()};row.textContent=p.name+' · '+p.kind+' · '+p.risk+' risk · '+(p.enabled?'ENABLED':'DISABLED')+' — '+p.description+' ';row.appendChild(b);box.appendChild(row)})}catch(e){log(e.message)}}
async function addPlugin(){const name=$('pluginName').value.trim();if(!name)return;try{await req('/api/plugins/add',{name,kind:$('pluginKind').value,endpoint:$('pluginEndpoint').value.trim(),auth_type:'none',permissions:[],project_scope:['*'],risk:'medium',enabled:false});$('pluginName').value='';$('pluginEndpoint').value='';await loadPlugins()}catch(e){log(e.message)}}
async function indexProject(){try{log(await req('/api/projects/index',{project:$('project').value}))}catch(e){log(e.message)}}
async function investigate(){const s=prompt('Problem/symptom to investigate:');if(!s)return;try{log(await req('/api/investigate',{project:$('project').value||'general',symptom:s}))}catch(e){log(e.message)}}
async function inspectUI(){const u=prompt('URL to inspect:','http://127.0.0.1:8766/');if(!u)return;try{log(await req('/api/browser/inspect',{project:$('project').value||'general',url:u}))}catch(e){log(e.message)}}
async function research(){const q=prompt('GitHub research query:');if(!q)return;try{log(await req('/api/research/github',{project:$('project').value||'general',query:q}))}catch(e){log(e.message)}}
async function runAll(){const tests=[['Health','/api/status'],['Dashboard','/api/dashboard'],['Capabilities','/api/capabilities'],['Projects','/api/projects'],['Plugins','/api/plugins'],['Resources','/api/resources'],['Neural state','/api/core/neural-state'],['Recovery ladder','/api/recovery/ladder'],['Incidents','/api/incidents']];$('testState').textContent='RUNNING';$('tests').innerHTML='';let fail=0;for(const [name,path] of tests){let ok=true,detail='OK';try{await req(path)}catch(e){ok=false;fail++;detail=e.message}const d=document.createElement('div');d.className=ok?'ok':'bad';d.textContent=(ok?'PASS ':'FAIL ')+name+' — '+detail;$('tests').appendChild(d)}$('testState').textContent=fail?('FAILED '+fail):'ALL PASS';$('testState').className='v '+(fail?'bad':'ok')}
refresh();setInterval(refresh,4000);
</script></body></html>
